name: Update Yoho Data

on:
  schedule:
    - cron: '5 * * * *'   # 毎時5分に実行
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch yoho data from GAS
        id: fetch
        run: |
          GAS_URL="https://script.google.com/macros/s/AKfycbyG9uM5R3HzzjKwIJfIoPZ19tB7kEx4mx0trZEVRIi7s_a8B9Pp3lH3SeENHNgYy7g/exec"
          mkdir -p data

          HTTP_CODE=$(curl -sLw "%{http_code}" \
            "$GAS_URL" \
            --max-time 30 \
            --retry 2 \
            -o data/yoho_tmp.json)

          echo "HTTP code: $HTTP_CODE"

          # JSONとして有効かどうかチェック
          if python3 -c "import json, sys; d=json.load(open('data/yoho_tmp.json')); sys.exit(0 if d.get('status')=='ok' else 1)" 2>/dev/null; then
            mv data/yoho_tmp.json data/yoho.json
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✓ Valid JSON (status=ok)"
          else
            rm -f data/yoho_tmp.json
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "✗ Invalid response or status != ok (GAS deployment要確認)"
          fi

      - name: Commit if changed
        if: steps.fetch.outputs.valid == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/yoho.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: yoho $(date -u +'%Y-%m-%d %H:00 UTC') [skip ci]"
            git pull --rebase
            git push
          fi
